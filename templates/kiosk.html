<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="{{ page_refresh_ms // 1000 }}" />
  <title>Kiosk</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow: hidden;
      background: #000;
      height: 100%;
      font-family: sans-serif;
    }

    #kiosk-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* Left side — photo slideshow */
    #slideshow-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #slideshow-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }

    #slideshow-container img.active {
      opacity: 1;
    }

    /* Right side — Google Calendar with inverted colors and 2x text */
    #calendar-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #fff;
      /* Invert colors and scale content to 2x for readability on kiosk displays */
      transform: scale(2);
      transform-origin: 0 0;
      width: 50%;
      height: 50%;
      filter: invert(1);
    }

    #calendar-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Small indicator in corner */
    #debug-info {
      position: fixed;
      bottom: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="kiosk-container">
    <!-- Left: Photo Slideshow -->
    <div id="slideshow-container">
      {% for photo in photos %}
      <img src="{{ photo }}" alt="Kiosk Photo" loading="lazy" />
      {% endfor %}
      {% if not photos %}
      <div style="color: #fff; text-align: center; padding: 20px;">No photos available</div>
      {% endif %}
    </div>

    <!-- Right: Google Calendar (Schedule/AGENDA view, fills entire area) -->
    <!-- Calendar is inverted and scaled 2x via the container CSS for kiosk readability -->
    <div id="calendar-container">
      <iframe
        id="calendar-frame"
        src="{{ google_calendar_url }}"
        title="Google Calendar"
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <div id="debug-info">Refreshing in {{ (page_refresh_ms // 1000) // 60 }} min</div>

  <script>
    // --- Calendar date range: only show events up to 2 weeks in the future ---
    const CALENDAR_BASE_URL = {{ google_calendar_url | tojson }};
    const CALENDAR_WEEKS_AHEAD = 2;

    function buildCalendarUrl(weeksAhead) {
      const now = new Date();
      const startDate = now.toISOString().slice(0, 10).replace(/-/g, "");
      const endDate = new Date(now);
      endDate.setDate(endDate.getDate() + (weeksAhead * 7));
      const endDateStr = endDate.toISOString().slice(0, 10).replace(/-/g, "");

      // Remove any existing dates param, then append the new one
      const baseUrl = CALENDAR_BASE_URL.replace(/[?&]dates=[^&]*/g, "");
      const separator = baseUrl.includes("?") ? "&" : "?";
      return baseUrl + separator + "dates=" + startDate + "/" + endDateStr;
    }

    // --- Calendar auto-refresh ---
    const calendarRefreshSeconds = {{ calendar_refresh_seconds }};
    const calendarFrame = document.getElementById('calendar-frame');

    function refreshCalendar() {
      calendarFrame.src = buildCalendarUrl(CALENDAR_WEEKS_AHEAD);
    }

    // Set the initial calendar URL with date range
    calendarFrame.src = buildCalendarUrl(CALENDAR_WEEKS_AHEAD);

    // Refresh calendar periodically (rebuild URL with fresh date range)
    setInterval(refreshCalendar, calendarRefreshSeconds * 1000);

    // --- Slideshow logic ---
    const slides = document.querySelectorAll('#slideshow-container img');
    let slideIndex = 0;
    const slideIntervalMs = {{ slideshow_interval_ms }};

    function showSlide(index) {
      slides.forEach((s, i) => {
        s.classList.toggle('active', i === index);
      });
    }

    function nextSlide() {
      if (slides.length === 0) return;
      slideIndex = (slideIndex + 1) % slides.length;
      showSlide(slideIndex);
    }

    // Initialize
    if (slides.length > 0) {
      showSlide(slideIndex);
      setInterval(nextSlide, slideIntervalMs);
    }
  </script>
</body>
</html>
