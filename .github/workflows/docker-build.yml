name: Docker Build & Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Grant GITHUB_TOKEN write permission to push packages to GHCR
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate date tags
        id: date_tags
        run: |
          DATE=$(date +%Y-%m-%d)
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 8)
          echo "date_tag=$DATE" >> $GITHUB_OUTPUT
          echo "date_sha_tag=$DATE-$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }},ghcr.io/${{ github.repository }}:${{ steps.date_tags.outputs.date_tag }},ghcr.io/${{ github.repository }}:${{ steps.date_tags.outputs.date_sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max